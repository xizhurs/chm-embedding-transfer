name: tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # the "fm" group (TabICL -> PyTorch) is large and not needed by the tests
      - name: Install dependencies
        run: uv sync --locked --no-group fm

      - name: Run tests
        run: uv run --no-sync pytest -q
